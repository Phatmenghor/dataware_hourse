spring:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  datasource:
    driver-class-name: ${DB_PRIMARY_DRIVER:org.postgresql.Driver}
    url: ${DB_PRIMARY_URL:jdbc:postgresql://localhost:5432/dwh_bi_local}
    username: ${DB_PRIMARY_USER:postgres}
    password: ${DB_PRIMARY_PASSWORD:password}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    cpb.dwh_bi_api: ${LOGGING_LEVEL_DWH:DEBUG}
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Local development Oracle connection (optional)
datasource:
  oracle:
    driver-class-name: ${DB_ORACLE_DRIVER:oracle.jdbc.OracleDriver}
    url: ${DB_ORACLE_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
    username: ${DB_ORACLE_USER:}
    password: ${DB_ORACLE_PASSWORD:}

# Excel Export Settings
excel:
  export:
    enabled: ${EXCEL_EXPORT_ENABLED:true}
    temp-directory: ${EXCEL_EXPORT_TEMP_DIR:./temp/excel}
    max-rows-per-sheet: ${EXCEL_EXPORT_MAX_ROWS:10000}
