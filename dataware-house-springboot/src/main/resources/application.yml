spring:
  application:
    name: dwh_bi_api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        jdbc:
          lob:
            non_contextual_creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC
  datasource:
    driver-class-name: ${DB_PRIMARY_DRIVER:org.postgresql.Driver}
    url: ${DB_PRIMARY_URL:jdbc:postgresql://localhost:5432/dwh_bi}
    username: ${DB_PRIMARY_USER:postgres}
    password: ${DB_PRIMARY_PASSWORD:password}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}
  undertow:
    always-set-keep-alive: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    cpb.dwh_bi_api: ${LOGGING_LEVEL_DWH:INFO}

jwt:
  secret: ${JWT_SECRET:cpbank@dwh@bi@secure@key@2024}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

security:
  ignored: /swagger-ui/**,/v3/api-docs/**
  jwt:
    require-https: ${SECURITY_JWT_REQUIRE_HTTPS:false}
    cookie-secure: ${SECURITY_JWT_COOKIE_SECURE:false}
    cookie-http-only: ${SECURITY_JWT_COOKIE_HTTP_ONLY:true}

# Oracle Database Connection (reporting/data fetch - optional)
datasource:
  oracle:
    driver-class-name: ${DB_ORACLE_DRIVER:oracle.jdbc.OracleDriver}
    url: ${DB_ORACLE_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
    username: ${DB_ORACLE_USER:}
    password: ${DB_ORACLE_PASSWORD:}

# Excel Export Settings
excel:
  export:
    enabled: ${EXCEL_EXPORT_ENABLED:true}
    temp-directory: ${EXCEL_EXPORT_TEMP_DIR:./temp/excel}
    max-rows-per-sheet: ${EXCEL_EXPORT_MAX_ROWS:10000}
