spring:
  application:
    name: dwh_bi_api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        jdbc:
          lob:
            non_contextual_creation: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8081
  undertow:
    always-set-keep-alive: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  level:
    root: INFO
    cpb.dwh_bi_api: DEBUG

jwt:
  secret: ${JWT_SECRET:cpbank@dwh@bi}
  expiration: 86400000

security:
  ignored: /**
