spring:
  application:
    name: dwh_bi_api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        generate_statistics: false
        jdbc:
          lob:
            non_contextual_creation: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

server:
  port: 8081
  undertow:
    always-set-keep-alive: true

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  level:
    root: INFO
    cpb.dwh_bi_api: INFO

jwt:
  secret: ${JWT_SECRET:cpbank@dwh@bi@secure@key@2024}
  expiration: 900000
  refresh-token-expiration: 604800000

security:
  ignored: /swagger-ui/**,/v3/api-docs/**

# Database Connection Settings (profile-specific)
datasource:
  primary:
    driver-class-name: ${DB_PRIMARY_DRIVER:org.postgresql.Driver}
    url: ${DB_PRIMARY_URL:jdbc:postgresql://localhost:5432/dwh_bi}
    username: ${DB_PRIMARY_USER:postgres}
    password: ${DB_PRIMARY_PASSWORD:password}

  # Oracle settings for reporting/data fetch (optional)
  oracle:
    driver-class-name: ${DB_ORACLE_DRIVER:oracle.jdbc.OracleDriver}
    url: ${DB_ORACLE_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
    username: ${DB_ORACLE_USER:}
    password: ${DB_ORACLE_PASSWORD:}
