spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  datasource:
    driver-class-name: ${DB_PRIMARY_DRIVER:org.postgresql.Driver}
    url: ${DB_PRIMARY_URL:jdbc:postgresql://prod-db-server:5432/dwh_bi}
    username: ${DB_PRIMARY_USER}
    password: ${DB_PRIMARY_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_MAX_POOL_SIZE:20}
      minimum-idle: ${DB_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/api}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:WARN}
    cpb.dwh_bi_api: ${LOGGING_LEVEL_DWH:WARN}
  file:
    name: ${LOGGING_FILE_NAME:/var/log/dwh_bi_api/application.log}
    max-size: 100MB
    max-history: 30
    total-size-cap: 10GB

# Production Oracle connection for reporting
datasource:
  oracle:
    driver-class-name: ${DB_ORACLE_DRIVER:oracle.jdbc.OracleDriver}
    url: ${DB_ORACLE_URL}
    username: ${DB_ORACLE_USER}
    password: ${DB_ORACLE_PASSWORD}
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3

# Excel Export Settings
excel:
  export:
    enabled: ${EXCEL_EXPORT_ENABLED:true}
    temp-directory: ${EXCEL_EXPORT_TEMP_DIR:/var/tmp/dwh_bi/excel}
    max-rows-per-sheet: ${EXCEL_EXPORT_MAX_ROWS:100000}
