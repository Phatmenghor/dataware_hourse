spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://prod-db:5432/dwh_cpb_bi}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  level:
    root: WARN
    cpb.dwh_bi_api: INFO

springdoc:
  swagger-ui:
    enabled: false
